<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎅 Secret Santa</h1>
    <div id="gmail-bar" class="muted">Loading…</div>
  </header>

  <main>
    <section class="card">
      <h2>Participants <span id="p-count" class="muted"></span></h2>
      <div id="participants-list"></div>
      <form id="add-form" class="add-row">
        <input id="add-name" placeholder="Name" required autocomplete="off">
        <input id="add-email" type="email" placeholder="Email" required autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="card">
      <h2>Email</h2>
      <label>Subject
        <input id="set-subject" autocomplete="off">
      </label>
      <div class="row">
        <label>Currency
          <select id="set-currency">
            <option value="£">£ Pound (GBP)</option>
            <option value="$">$ US Dollar (USD)</option>
            <option value="€">€ Euro (EUR)</option>
            <option value="¥">¥ Japanese Yen (JPY)</option>
            <option value="₹">₹ Indian Rupee (INR)</option>
            <option value="A$">A$ Australian Dollar (AUD)</option>
            <option value="C$">C$ Canadian Dollar (CAD)</option>
            <option value="S$">S$ Singapore Dollar (SGD)</option>
            <option value="HK$">HK$ Hong Kong Dollar (HKD)</option>
            <option value="CHF">CHF Swiss Franc (CHF)</option>
            <option value="kr">kr Norwegian Krone (NOK)</option>
            <option value="zł">zł Polish Złoty (PLN)</option>
            <option value="R$">R$ Brazilian Real (BRL)</option>
            <option value="₩">₩ South Korean Won (KRW)</option>
            <option value="₺">₺ Turkish Lira (TRY)</option>
            <option value="R">R South African Rand (ZAR)</option>
            <option value="Ft">Ft Hungarian Forint (HUF)</option>
            <option value="Kč">Kč Czech Koruna (CZK)</option>
          </select>
        </label>
        <label>Max spend
          <input id="set-spend" inputmode="decimal" autocomplete="off">
        </label>
      </div>
      <label>Extra notes <span class="muted small">(optional — e.g. "No vouchers!")</span>
        <textarea id="set-notes" rows="2" placeholder="Anything else the group should know…"></textarea>
      </label>
      <label class="check">
        <input type="checkbox" id="set-norecip">
        Avoid reciprocal pairs (A draws B and B draws A)
      </label>
      <button id="save-settings" type="button">Save email settings</button>
    </section>

    <section class="card">
      <h2>Draw &amp; send</h2>
      <div id="draw-actions" class="actions"></div>
      <div id="preview"></div>
      <div id="send-section" hidden>
        <hr>
        <div id="send-actions" class="actions"></div>
        <table id="send-status"></table>
      </div>
    </section>
  </main>

  <footer class="muted small">
    Runs locally • your data stays in <code>data/state.json</code> — keep it private,
    it contains the full draw.
  </footer>

  <div id="flash" class="flash" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
